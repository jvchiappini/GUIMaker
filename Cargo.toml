[workspace]
members = [
    "crates/gui_maker",
    "apps/gui_maker_studio",
]
resolver = "2"

# `crates/gui_maker` is the library Koncreta consumes; `apps/gui_maker_studio`
# is the desktop visual builder (parked while the UI toolkit is built).

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
